# ============================================================
# Nginx 生产部署配置
# 用途: 反向代理 AI 服务(8080) + 托管前端静态文件(5173→dist)
# 放置位置: /etc/nginx/sites-available/safeagent
# ============================================================

upstream ai_backend {
    # AI FastAPI 服务,可配多个 worker
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;  # 改为你的域名,如 safeagent.example.com

    # ======== 上传限制 ========
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # ======== 安全头 ========
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ======== 访问日志 ========
    access_log /var/log/nginx/safeagent_access.log;
    error_log  /var/log/nginx/safeagent_error.log;

    # ======== 前端静态文件 ========
    root /opt/safeagent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======== AI API 反向代理 ========
    location /api/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时(Agent对话可能较慢)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲
        proxy_buffering off;
    }

    location /ai/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ======== WebSocket 实时推送 ========
    location /ws/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ======== API 文档(可选,生产可注释掉) ========
    location /docs {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://ai_backend;
    }
}
