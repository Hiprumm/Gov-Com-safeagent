# ============================================================
# Nginx 生产部署配置
# 用途: 反向代理 AI 服务(8080) + 托管前端静态文件(5173→dist)
# 放置位置: /etc/nginx/sites-available/safeagent
# ============================================================

upstream ai_backend {
    # AI FastAPI 服务,可配多个 worker
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;  # 改为你的域名,如 safeagent.example.com

    # ======== 上传限制 ========
    client_max_body_size 50m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # ======== 安全头 ========
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ======== 访问日志 ========
    access_log /var/log/nginx/safeagent_access.log;
    error_log  /var/log/nginx/safeagent_error.log;

    # ======== 前端静态文件 ========
    root /opt/safeagent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======== AI API 反向代理 ========
    location /api/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 超时(Agent对话可能较慢)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲
        proxy_buffering off;
    }

    location /ai/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ======== WebSocket 实时推送 ========
    location /ws/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ======== API 文档(可选,生产可注释掉) ========
    location /docs {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://ai_backend;
    }
}

# ============================================================
# HTTPS（443）监听
# 将正式证书(server.crt/server.key)放入 deploy/certs 后重启 nginx 即生效；
# 无正式证书时可用 deploy/gen-certs.sh 生成自签证书（仅限内网/测试）。
# 注：docker-compose 复用前一个 server{} 的 root/静态/代理配置逻辑，
#     为可读起见此处显式声明一份（proxy 到同一 ai_backend upstream）。
# ============================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/safeagent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location /ws/ {
        proxy_pass http://ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
