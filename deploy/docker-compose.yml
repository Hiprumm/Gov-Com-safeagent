# ============================================================
# Docker Compose 一键部署（生产推荐形态）
# 启动: docker compose -f deploy/docker-compose.yml up -d
# 停止: docker compose -f deploy/docker-compose.yml down
#
# 默认存储：PostgreSQL（生产建议）。若需沿用零依赖 SQLite，
# 可 export STORAGE_BACKEND=sqlite 再启动，数据落 ai_data 卷。
# 务必在生产 .env 配置 AUTH_JWT_SECRET（否则令牌跨重启失效）。
# ============================================================

version: "3.8"

services:
  # 生产数据库（PostgreSQL，替代 SQLite 单文件，支持多 worker 并发写）
  postgres:
    image: postgres:16-alpine
    container_name: safeagent-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeagent}
      POSTGRES_USER: ${POSTGRES_USER:-safeagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeagent}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safeagent} -d ${POSTGRES_DB:-safeagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # AI 服务（多 worker；应急/限流等关键状态已改为读库为准，跨 worker 一致）
  ai-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: safeagent-ai
    ports:
      - "8080:8080"
    env_file:
      - ../ai_service/.env
    environment:
      # environment 优先于 env_file；生产默认 postgres，可用 ${VAR} 覆盖
      STORAGE_BACKEND: ${STORAGE_BACKEND:-postgres}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-safeagent}
      POSTGRES_USER: ${POSTGRES_USER:-safeagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeagent}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
    volumes:
      - ai_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (前端 + 反向代理 + HTTPS 终止)
  nginx:
    image: nginx:alpine
    container_name: safeagent-nginx
    entrypoint: ["/docker-entrypoint.d/entrypoint.sh"]
    volumes:
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/entrypoint.sh:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/opt/safeagent/frontend/dist:ro
      # 正式证书放 ./certs/server.crt|server.key；缺失时容器启动自动生成自签（内网/测试）
      - ./certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ai-service
    restart: unless-stopped

  # 工具执行沙箱（可选——Docker 不可用时自动降级为本地模拟）
  tool-sandbox:
    build:
      context: ../docker/tool-sandbox
      dockerfile: Dockerfile
    image: safeagent-tool-sandbox:latest
    container_name: safeagent-sandbox
    # 不暴露端口（仅内部使用）
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sandbox_net
    restart: "no"  # 按需启动，不自动重启

networks:
  sandbox_net:
    driver: bridge
    internal: true  # 仅内部网络，无出站访问

volumes:
  pg_data:
  ai_data: