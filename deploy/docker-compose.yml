# ============================================================
# Docker Compose 一键部署
# 启动: docker compose -f deploy/docker-compose.yml up -d
# 停止: docker compose -f deploy/docker-compose.yml down
# ============================================================

version: "3.8"

services:
  # AI 服务
  ai-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: safeagent-ai
    ports:
      - "8080:8080"
    env_file:
      - ../ai_service/.env
    volumes:
      - ai_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx (前端 + 反向代理)
  nginx:
    image: nginx:alpine
    container_name: safeagent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/opt/safeagent/frontend/dist:ro
    depends_on:
      - ai-service
    restart: unless-stopped

  # 工具执行沙箱（可选——Docker不可用时自动降级为本地模拟）
  tool-sandbox:
    build:
      context: ../docker/tool-sandbox
      dockerfile: Dockerfile
    image: safeagent-tool-sandbox:latest
    container_name: safeagent-sandbox
    # 不暴露端口（仅内部使用）
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - sandbox_net
    restart: "no"  # 按需启动，不自动重启

networks:
  sandbox_net:
    driver: bridge
    internal: true  # 仅内部网络，无出站访问

volumes:
  ai_data:
