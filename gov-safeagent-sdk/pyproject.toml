[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gov-safeagent-sdk"
version = "0.1.0"
description = "政企大模型智能体安全防护 SDK —— 嵌入任意 Agent 的安全能力层（检测/能力治理/操作守卫/输出过滤/审计链）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Gov-Com-SafeAgent Team" }]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
adapters = ["langchain>=0.2", "llama-index>=0.10"]

[tool.setuptools.packages.find]
include = ["gov_safeagent_sdk*"]
